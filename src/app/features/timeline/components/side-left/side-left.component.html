<aside
  class="w-full text-sm sticky top-20 bg-white rounded-[20px] shadow-sm border border-slate-50 p-2.5 flex flex-col gap-1"
  [attr.aria-label]="'sidebar.ariaLabel' | translate"
>
  <button
    routerLink="posts"
    routerLinkActive="bg-blue-50 text-blue-600"
    [routerLinkActiveOptions]="{ exact: true }"
    class="sidebar-link"
  >
    <i class="fa-regular fa-newspaper w-5 text-center"></i>
    <span>{{ 'sidebar.feed' | translate }}</span>
  </button>

  <button
    routerLink="myposts"
    routerLinkActive="bg-blue-50 text-blue-600"
    [routerLinkActiveOptions]="{ exact: true }"
    class="sidebar-link"
  >
    <i class="fa-solid fa-wand-magic-sparkles w-5 text-center"></i>
    <span>{{ 'sidebar.myPosts' | translate }}</span>
  </button>

  <button class="sidebar-link">
    <i class="fa-solid fa-globe w-5 text-center"></i>
    <span>{{ 'sidebar.community' | translate }}</span>
  </button>

  <button class="sidebar-link">
    <i class="fa-regular fa-bookmark w-5 text-center"></i>
    <span>{{ 'sidebar.saved' | translate }}</span>
  </button>
</aside>
