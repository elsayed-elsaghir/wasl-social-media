<div
  class="fixed inset-0 z-100 flex items-center justify-center bg-black/50 p-4"
  (click)="closeModal()"
>
  <div
    class="w-full max-w-md overflow-hidden rounded-xl bg-white shadow-xl"
    (click)="$event.stopPropagation()"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-gray-200 p-4">
      <h2 class="text-lg font-semibold text-gray-800">Likes</h2>

      <button
        type="button"
        (click)="closeModal()"
        class="flex cursor-pointer size-9 items-center justify-center rounded-full text-gray-500 transition hover:bg-gray-100 hover:text-gray-800"
      >
        <i class="fa-solid fa-xmark text-xl"></i>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="max-h-96 min-h-24 overflow-y-auto p-4">
      <!-- Loading -->

      <!-- Likes List -->
      @if (!isLoaded()) {
        <div class="py-8 text-center text-gray-500">Loading likes...</div>
      } @else {
        @for (like of postLikes(); track like.id) {
          <div class="flex items-center gap-3 rounded-lg p-2 transition hover:bg-gray-50">
            <!-- User Photo -->
            <img
              [src]="like.photo || '/images/default-user.png'"
              [alt]="like.name"
              class="size-11 rounded-full border border-gray-200 object-cover"
            />

            <!-- User Name -->
            <div class="min-w-0 flex-1">
              <p class="truncate font-semibold text-gray-800">
                {{ like.name }}
              </p>
            </div>
          </div>
        } @empty {
          <div class="py-10 text-center">
            <i class="fa-regular fa-heart mb-3 text-3xl text-gray-400"></i>

            <p class="text-sm text-gray-500">No likes yet.</p>
          </div>
        }
      }
    </div>
  </div>
</div>
